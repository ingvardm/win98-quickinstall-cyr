# ---------------------------------------------------------------------------
# recipe.ini -- all data for the Cyrillic QuickInstall fork (see README.md)
#
# Parsed by cyrillize.py with configparser(interpolation=None, optionxform=str).
# Multi-line values (reg / win_ini / system_ini) are continuation lines indented
# by 4 spaces; the indentation is stripped by configparser, the lines are kept.
# All inserted text is ASCII. Nothing here is a Microsoft binary: the actual
# file payloads are extracted from BASE4.CAB (repo root) at build time.
# No input hashes are pinned -- any single-variant QuickInstall ISO is accepted.
# ---------------------------------------------------------------------------

[meta]
; Appended to osroots/1/win98qi.inf (a separating space is added in code).
label_suffix = [RU fonts, EN UI]
; Deterministic metadata for files that are INSERTED (not present in input
; payload). Never read from the filesystem: keeps the build reproducible.
; attr 0x20 = _A_ARCH, date = packed DOS date for 1999-05-06, time = 00:00:00.
new_file_attr = 32
new_file_date = 9894
new_file_time = 0
; Constants used by --verify.
win_ini_marker = MS Sans Serif,0=MS Sans Serif,204
system_ini_marker = oemansi.bin=xlat866.bin

[reg]
; Reference only: the Russian Win98 SE CD's HKLM recipe (see README.md).
; HKCU\Control Panel\International\Locale is deliberately NOT touched, so the
; UI stays English. This is NOT consumed as a .reg file any more -- the build
; is wine-free and applies the [creg] in-place edits below. The four cp_*.nls
; mappings already exist in the stock registry, and "SystemLocale" is a
; Win9x-ignored marker whose addition would require growing the CREG hive, so
; it is intentionally not applied.
lines =
    REGEDIT4
    [HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Nls\Codepage]
    "ACP"="1251"
    "OEMCP"="866"
    "1251"="cp_1251.nls"
    "866"="cp_866.nls"
    "20866"="cp_20866.nls"
    "28595"="cp_28595.nls"
    [HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Nls\Locale]
    @="00000419"
    "SystemLocale"="00000419"

[creg]
; Pure-Python in-place Win9x (CREG) REG_SZ value edits, applied to SYSTEM.DAT
; inside SLOWPNP.866 / FASTPNP.866. Format:  name | current | desired
; '@' denotes a key's default (unnamed) value. Every edit is same-length ASCII,
; so no key node / pointer / value-count / free-space chain is touched.
ACP = 1252 | 1251
OEMCP = 437 | 866
@ = 00000409 | 00000419

[win_ini]
; [CyrSubs] lines appended inside the existing [FontSubstitutes] section
; (see README.md). The tool keeps the 5 existing aliases and de-dupes;
; "MS Shell Dlg=MS Sans Serif" already exists and is therefore skipped.
cyrsubs =
    MS Shell Dlg=MS Sans Serif
    System,0=System,204
    Fixedsys,0=Fixedsys,204
    Small Fonts,0=Small Fonts,204
    MS Sans Serif,0=MS Sans Serif,204
    MS Shell Dlg,204=MS Sans Serif,204
    MS Serif,0=MS Serif,204
    Arial Cyr,204=Arial,204
    Arial Cyr,0=Arial,204
    Arial CE,238=Arial,238
    Courier New Cyr,204=Courier New,204
    Courier New Cyr,0=Courier New,204
    Courier,0=Courier New,204
    Courier New CE,238=Courier New,238
    Times New Roman Cyr,204=Times New Roman,204
    Times New Roman Cyr,0=Times New Roman,204
    Times New Roman CE,238=Times New Roman,238
    Helvetica,204=Arial,204
    Helvetica,0=Arial,204
    Times,204=Times New Roman,204
    Times,0=Times New Roman,204

[system_ini]
; [keyboard] oemansi.bin= is currently empty; point it at xlat866.bin
; (see README.md).
oemansi = oemansi.bin=xlat866.bin

[fonts]
; 15 replacements, [CP866] / LDID 20 = WINDOWS/FONTS (see README.md).
; DEST = <source-in-BASE4.CAB> | <expected-size>
WINDOWS/FONTS/DOSAPP.FON = app866.fon | 37328
WINDOWS/FONTS/VGAOEM.FON = vga866.fon | 5152
WINDOWS/FONTS/VGASYS.FON = vgas1251.fon | 6912
WINDOWS/FONTS/VGAFIX.FON = vgaf1251.fon | 5600
WINDOWS/FONTS/SSERIFE.FON = ssee1251.fon | 68848
WINDOWS/FONTS/SERIFE.FON = sere1251.fon | 63296
WINDOWS/FONTS/COURE.FON = coue1251.fon | 23440
WINDOWS/FONTS/SMALLE.FON = smae1251.fon | 24832
WINDOWS/FONTS/8514SYS.FON = 85s1251.fon | 10064
WINDOWS/FONTS/8514FIX.FON = 85f1251.fon | 10976
WINDOWS/FONTS/8514OEM.FON = 85866.fon | 12288
WINDOWS/FONTS/SSERIFF.FON = ssef1251.fon | 98256
WINDOWS/FONTS/SERIFF.FON = serf1251.fon | 90736
WINDOWS/FONTS/COURF.FON = couf1251.fon | 31808
WINDOWS/FONTS/SMALLF.FON = smaf1251.fon | 19760

[adds]
; [CopyDat866] / [CyrillicKbds] / CopyDOSIntl (see README.md).
; COUNTRY.SYS is present (and byte-identical to the donor) in the stock image
; and was stripped by 98Lite; insert-or-replace handles both with one branch.
; DEST = <source-in-BASE4.CAB> | <expected-size>
WINDOWS/SYSTEM/CHARSET.DAT = 866.dat | 524
WINDOWS/SYSTEM/XLAT866.BIN = xlat866.bin | 324
WINDOWS/SYSTEM/KBDRU.KBD = kbdru.kbd | 473
WINDOWS/COMMAND/EGA3.CPI = ega3.cpi | 58753
WINDOWS/COMMAND/COUNTRY.SYS = country.sys | 30742
